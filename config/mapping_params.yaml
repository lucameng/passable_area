passable_area:
  ros__parameters:
    map_length:    10.0
    map_width:     10.0
    map_height_min: -1.5
    map_height_max:  1.5
    voxel_size:    0.05
    max_drop:      0.18
    max_roughness: 0.04

    clearance_threshold: 0.0
    baseline_radius: 0.0

    use_legacy_elevation: true
    elevation_solver_bins: 16
    solver_region_enabled: false
    solver_region_min_x: 0.0
    solver_region_max_x: 4.0
    solver_region_min_y: 0.0
    solver_region_max_y: 0.0

    world_frame:   "camera_init"
    gravity_frame: "base_gravity"
    body_frame:    "base_link"
    used_frame:    "base_link"
    dog_model:     "m20"

    enable_blind_check: true

    dog_models:
      x30:
        body_params:
          body_length: 0.9
          body_width: 0.4
      m20:
        body_params:
          body_length: 0.82
          body_width: 0.43
