passable_area:
  ros__parameters:
    map_length:    10.0
    map_width:     10.0
    map_height_min: -1.5
    map_height_max:  1.5
    voxel_size:    0.05
    max_drop:      0.18
    max_roughness: 0.04
    max_inpaint_pixels: 200
    enable_center_padding: true
    center_dist_thresh: 0.8
    clearance_threshold: 0.0
    baseline_radius: 0.0

    accumulate_cloud_topic: "/accumulate_cloud/cloud_base"
    imu_topic: "/IMU_YESENSE"
    passable_cloud_topic: "/passable_area"
    impassable_cloud_topic: "/impassable_area"
    grid_map_topic: "/grid_map"

    use_legacy_elevation: true
    elevation_solver_bins: 16
    solver_region_enabled: false
    solver_region_min_x: 0.0
    solver_region_max_x: 4.0
    solver_region_min_y: 0.0
    solver_region_max_y: 0.0

    world_frame:   "camera_init"
    gravity_frame: "base_gravity"
    body_frame:    "base_link"
    used_frame:    "base_link"
    dog_model:     "m20"

    enable_blind_check: true
