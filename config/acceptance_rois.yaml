false_obstacle:
  bags_source: config/offline_benchmark_bags.yaml
  excluded_bags:
    - rosbag2_mtbf_x30_upstair_passage
  detection_box:
    x_min: 0.0
    x_max: 1.4
    y_min: -0.25
    y_max: 0.25

miss_obstacle:
  setups:
    - name: open_up_down_stairs
      bag: /home/deep/deeprobotics/bags/test_result/rosbag2_open_up_down_stairs
      config_overrides:
        map_height_max: 0.5
      window:
        start_offset_sec: 6.7
        time_window_sec: 0.4
      rois:
        - name: left_board
          x_min: 0.8
          x_max: 2.7
          y_min: 0.4
          y_max: 0.6
        - name: right_board
          x_min: 0.8
          x_max: 2.7
          y_min: -0.6
          y_max: -0.4

    - name: open_stair_and_slope
      bag: /home/deep/deeprobotics/bags/offline_bags/rosbag2_open_stair_and_slope
      config_overrides:
        map_height_max: 0.5
      window:
        start_offset_sec: 5.7
        time_window_sec: 0.3
      rois:
        - name: left_side_board
          x_min: 1.5
          x_max: 2.5
          y_min: 0.4
          y_max: 0.6
        - name: right_side_board
          x_min: 1.5
          x_max: 2.5
          y_min: -0.6
          y_max: -0.4

