passable_area:
  ros__parameters:
    map_length: 8.0
    map_width: 8.0
    map_resolution: 0.05
    map_height_min: -1.5
    map_height_max: 0.5

    max_support_slope: 28.0
    max_step_up: 0.22
    max_step_down: 0.38
    max_support_roughness: 0.08
    min_clearance: 0.5
    profile_split_gap: 0.10

    dropout_sector_gap_threshold: 8
    min_support_confidence: 0.2
    stale_to_unknown_time: 0.8
    sector_count: 72
    min_points_per_sector: 12
    support_persistence_frames: 5
    obstacle_clear_observed_decay: 0.2
    obstacle_clear_partial_decay_scale: 0.35
    obstacle_height_clear_threshold: 0.25
    obstacle_points_min_evidence: 0.4
    obstacle_points_min_height: 0.10
    obstacle_points_max_height_in_base_link: 0.20

    map_frame: "map"
    base_gravity_frame: "base_gravity"
    body_frame: "base_link"

    downsample:
      enable: true
      voxel_size: 0.05

    preprocess:
      body_filter:
        enable: true
        x_min: -0.5
        x_max: 0.5
        y_min: -0.3
        y_max: 0.3
        z_min: -0.8
        z_max: 0.5
      crop_to_map:
        enable: true
        xy_margin: 0.05

    sync:
      queue_size: 10
